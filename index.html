<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Расписание Геофак БГУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #f4f6f9 0%, #e9eef5 100%);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --glass-card: rgba(255, 255, 255, 0.72);
      --glass-card-subtle: rgba(255, 255, 255, 0.45);
      --glass-border: rgba(255, 255, 255, 0.9);
      --glass-inner-bevel: inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.04);
      --nav-active-bg: #0f172a;
      --nav-active-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.06);
    }

    .dark {
      --bg-gradient: linear-gradient(180deg, #090c12 0%, #0f141f 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --glass-card: rgba(22, 28, 41, 0.7);
      --glass-card-subtle: rgba(30, 38, 56, 0.5);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-inner-bevel: inset 0 1px 1px 0 rgba(255, 255, 255, 0.14);
      --card-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.5);
      --nav-active-bg: #f8fafc;
      --nav-active-text: #090c12;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Оптимизированная шапка: аппаратный блюр только здесь */
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: max(10px, env(safe-area-inset-top, 10px)) 16px 8px;
    }

    .header-glass {
      background: var(--glass-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transform: translateZ(0);
    }

    /* Облегченная стеклянная карточка: без дорогого blur, чистый GPU-композитинг */
    .card-glass {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow), var(--glass-inner-bevel);
      border-radius: 20px;
      padding: 14px 16px;
      transform: translateZ(0);
      contain: content;
    }

    .badge-subtle {
      background: var(--glass-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
    }

    /* Аппаратно ускоренная рамка активной пары: трансформация псевдоэлемента вместо тяжелого конического градиента */
    .active-lesson-card {
      position: relative;
      border-radius: 20px;
      padding: 1.5px;
      overflow: hidden;
      contain: paint;
    }

    .active-lesson-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent,
        rgba(16, 185, 129, 0.1) 40%,
        rgba(16, 185, 129, 0.9) 50%,
        transparent 60%
      );
      animation: rotateBorder 4s linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes rotateBorder {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .active-lesson-inner {
      position: relative;
      z-index: 1;
      background: var(--glass-card);
      border-radius: 18.5px;
      padding: 14px 16px;
      box-shadow: var(--glass-inner-bevel);
    }

    /* Анимация важной пары: 60 FPS через opacity */
    .important-pulse {
      position: relative;
    }
    .important-pulse::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      border: 1px solid rgba(245, 158, 11, 0.6);
      animation: pulseGlow 2.8s ease-in-out infinite;
      pointer-events: none;
      will-change: opacity;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.85; }
    }

    /* Разметка подгрупп: 2 колонки */
    .subgroups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .subgroup-box {
      background: var(--glass-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-sheet {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 28px 28px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--card-shadow);
      transform: translateZ(0);
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="header-glass">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 36px; height: 36px; border-radius: 12px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; shrink-0;">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"></polygon>
          </svg>
        </div>
        <div style="min-width: 0;">
          <div id="headerTitle" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Загрузка...</div>
          <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981;"></span>
            <span id="headerSync" style="font-size: 10px; color: var(--text-sub); font-weight: 500;">Деканат: проверка...</span>
          </div>
        </div>
      </div>

      <button onclick="openWizard()" style="padding: 7px 12px; border-radius: 12px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-main); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px;">
        <svg style="width: 13px; height: 13px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Настройки</span>
      </button>
    </div>
  </header>

  <main style="flex: 1; padding: 6px 16px 16px; max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;">
    
    <!-- Переключатель Сегодня / Завтра -->
    <div style="background: var(--glass-card-subtle); padding: 3px; border-radius: 14px; display: flex; gap: 4px; border: 1px solid var(--border-color);">
      <button id="btnToday" onclick="switchPrimaryTab('today')" style="flex: 1; padding: 7px; border-radius: 11px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.15s, color 0.15s;">Сегодня</button>
      <button id="btnTomorrow" onclick="switchPrimaryTab('tomorrow')" style="flex: 1; padding: 7px; border-radius: 11px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; transition: background 0.15s, color 0.15s;">Завтра</button>
    </div>

    <!-- Список пар первичного дня -->
    <div id="primaryList" style="display: flex; flex-direction: column; gap: 10px;"></div>

    <!-- Горизонтальная лента дней -->
    <div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-sub);">Остальные дни</span>
      <span style="font-size: 10px; color: var(--text-sub); font-weight: 600;">БГУ Live</span>
    </div>
    
    <div id="daysScroll" class="no-scrollbar" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px;"></div>
    
    <!-- Список пар выбранного вторичного дня -->
    <div id="secondaryList" style="display: flex; flex-direction: column; gap: 10px;"></div>

  </main>

  <!-- Модальное окно настроек -->
  <div id="wizardModal" class="modal-overlay">
    <div class="modal-sheet">
      <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <div>
          <span id="wizardStepLabel" style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-sub);">Шаг 1 из 4</span>
          <h3 id="wizardStepTitle" style="font-size: 15px; font-weight: 800; margin-top: 2px;">Курс и тема</h3>
        </div>
        <button onclick="closeWizard()" style="background: none; border: none; color: var(--text-sub); padding: 4px; cursor: pointer;">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div id="wizardBody" class="no-scrollbar" style="overflow-y: auto; max-height: 55vh; display: flex; flex-direction: column; gap: 14px;">
        <!-- Динамический контент шагов -->
      </div>

      <div style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;">
        <button id="wizardBackBtn" onclick="prevWizardStep()" style="flex: 1; padding: 11px; border-radius: 14px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-main); font-size: 12px; font-weight: 700; display: none;">Назад</button>
        <button id="wizardNextBtn" onclick="nextWizardStep()" style="flex: 2; padding: 11px; border-radius: 14px; background: var(--nav-active-bg); border: none; color: var(--nav-active-text); font-size: 12px; font-weight: 700;">Далее</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#090c12');
    }

    let facultyData = null;
    let currentProfile = {
      course: "1",
      group_name: "",
      foreign_lang: "ALL",
      important_subjects: []
    };

    let activeTab = 'today';
    let selectedSecondaryDay = '';
    let wizardStep = 1;
    let draftProfile = { ...currentProfile };

    function initTheme() {
      const saved = localStorage.getItem('bsu_theme') || 'dark';
      document.documentElement.classList.toggle('dark', saved === 'dark');
    }

    function setTheme(mode) {
      document.documentElement.classList.toggle('dark', mode === 'dark');
      localStorage.setItem('bsu_theme', mode);
      renderWizardStep();
    }

    async function loadData() {
      try {
        const res = await fetch('schedule_data.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        facultyData = await res.json();
        return true;
      } catch (e) {
        return false;
      }
    }

    function cleanTeacherAndRoom(str) {
      if (!str) return { teacher: '', room: null };
      let s = str.replace(/^[12]\s*(?:п\/г|подгр\.?|подгруппа)\s*/i, '').trim();
      const m = s.match(/(?:ауд\.?|спорткомплекс|каб\.?)\s*([0-9/\-а-яА-Яa-zA-Z]+|\S+)/i);
      let room = null;
      if (m) {
        room = m[0].trim();
        s = s.replace(m[0], '').trim();
      }
      s = s.replace(/^[-–—•,\s]+|[-–—•,\s]+$/g, '').trim();
      return { teacher: s, room };
    }

    function filterByLang(text, lang) {
      if (!lang || lang === 'ALL') return true;
      const lower = text.toLowerCase();
      const map = {
        'EN': ['нем', 'немец', 'франц', 'исп', 'рки'],
        'DE': ['англ', 'франц', 'исп', 'рки'],
        'FR': ['англ', 'нем', 'немец', 'исп', 'рки'],
        'RKI': ['англ', 'нем', 'немец', 'франц', 'исп'],
      };
      return !(map[lang] && map[lang].some(marker => lower.includes(marker)));
    }

    function parseLessons(list) {
      if (!list || !list.length) return [];
      const kept = list.filter(l => filterByLang(l, currentProfile.foreign_lang));
      if (!kept.length) return [];

      if (kept.length === 2) {
        const t1 = kept[0].split('\n')[0].replace(/\((лекц\.?|лаб\.?|практ\.?|сем\.?)\)/gi, '').trim();
        const t2 = kept[1].split('\n')[0].replace(/\((лекц\.?|лаб\.?|практ\.?|сем\.?)\)/gi, '').trim();
        if (t1.toLowerCase() === t2.toLowerCase()) {
          return [{
            title: t1,
            subgroups: [
              cleanTeacherAndRoom(kept[0].split('\n').slice(1).join(' ')),
              cleanTeacherAndRoom(kept[1].split('\n').slice(1).join(' '))
            ]
          }];
        }
      }

      return kept.map(raw => {
        const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
        const title = (lines[0] || 'Пара').replace(/\((лекц\.?|лаб\.?|практ\.?|сем\.?)\)/gi, '').trim();
        const details = lines.slice(1);
        const l1 = details.find(l => /1\s*(?:п\/г|подгр)/i.test(l));
        const l2 = details.find(l => /2\s*(?:п\/г|подгр)/i.test(l));

        if (l1 && l2) {
          return {
            title,
            subgroups: [cleanTeacherAndRoom(l1), cleanTeacherAndRoom(l2)]
          };
        }

        const roomMatch = raw.match(/ауд\.?\s*([0-9/\-а-яА-Яa-zA-Z]+)/i);
        return {
          title,
          room: roomMatch ? `ауд. ${roomMatch[1]}` : null,
          details: details.join(' • ')
        };
      });
    }

    function isLessonLive(timeSlot) {
      const m = timeSlot.match(/(\d{2})[:.](\d{2})[–-](\d{2})[:.](\d{2})/);
      if (!m) return false;
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      const start = parseInt(m[1]) * 60 + parseInt(m[2]);
      const end = parseInt(m[3]) * 60 + parseInt(m[4]);
      return cur >= start && cur <= end;
    }

    function renderDayCards(dayName, container, isToday) {
      container.innerHTML = '';
      if (!facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name]) {
        container.innerHTML = '<div class="card-glass" style="text-align: center; color: var(--text-sub); font-size: 12px; padding: 24px;">Расписание не найдено</div>';
        return;
      }

      const schedule = facultyData.courses[currentProfile.course][currentProfile.group_name];
      const slots = schedule[dayName] || {};
      const times = Object.keys(slots);

      if (!times.length) {
        container.innerHTML = '<div class="card-glass" style="text-align: center; color: var(--text-sub); font-size: 12px; padding: 24px;">В этот день пар нет</div>';
        return;
      }

      const frag = document.createDocumentFragment();

      times.forEach(timeStr => {
        const items = parseLessons(slots[timeStr]);
        const isLive = isToday && isLessonLive(timeStr);
        const hasImportant = items.some(item => currentProfile.important_subjects.some(imp => item.title.toLowerCase().includes(imp.toLowerCase())));

        const wrapper = document.createElement('div');
        wrapper.className = isLive ? 'active-lesson-card' : 'card-glass' + (hasImportant ? ' important-pulse' : '');

        let innerContent = `
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="badge-subtle" style="font-family: monospace; font-weight: 700; ${isLive ? 'background: #10b981; color: #fff;' : ''}">${timeStr}</span>
              ${isLive ? '<span class="badge-subtle" style="color: #10b981; border-color: rgba(16,185,129,0.3);">Идёт сейчас</span>' : ''}
              ${hasImportant ? '<span class="badge-subtle" style="color: #f59e0b; border-color: rgba(245,158,11,0.3);">Важная пара</span>' : ''}
            </div>
          </div>
        `;

        if (!items.length) {
          innerContent += `<div style="font-size: 12px; color: var(--text-sub);">Окно / Свободное время</div>`;
        } else {
          items.forEach((item, idx) => {
            innerContent += `
              <div style="${idx > 0 ? 'margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-color);' : ''}">
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;">
                  <div style="font-size: 13.5px; font-weight: 700; line-height: 1.35;">${item.title}</div>
                  ${item.room ? `<span class="badge-subtle">${item.room}</span>` : ''}
                </div>
                ${item.subgroups ? `
                  <div class="subgroups-grid">
                    <div class="subgroup-box">
                      <div style="display: flex; justify-content: space-between; font-size: 9.5px; font-weight: 800; color: var(--text-sub); text-transform: uppercase;">
                        <span>1 подгруппа</span>
                        ${item.subgroups[0].room ? `<span>${item.subgroups[0].room}</span>` : ''}
                      </div>
                      <div style="font-size: 11px; font-weight: 500;">${item.subgroups[0].teacher || '—'}</div>
                    </div>
                    <div class="subgroup-box">
                      <div style="display: flex; justify-content: space-between; font-size: 9.5px; font-weight: 800; color: var(--text-sub); text-transform: uppercase;">
                        <span>2 подгруппа</span>
                        ${item.subgroups[1].room ? `<span>${item.subgroups[1].room}</span>` : ''}
                      </div>
                      <div style="font-size: 11px; font-weight: 500;">${item.subgroups[1].teacher || '—'}</div>
                    </div>
                  </div>
                ` : (item.details ? `<div style="font-size: 11px; color: var(--text-sub); margin-top: 4px;">${item.details}</div>` : '')}
              </div>
            `;
          });
        }

        if (isLive) {
          wrapper.innerHTML = `<div class="active-lesson-inner">${innerContent}</div>`;
        } else {
          wrapper.innerHTML = innerContent;
        }

        frag.appendChild(wrapper);
      });

      container.appendChild(frag);
    }

    function getDays() {
      const schedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
      const keys = Object.keys(schedule);
      if (!keys.length) return { today: '', tomorrow: '', others: [] };

      const daysOfWeek = ['ВОСКРЕСЕНЬЕ', 'ПОНЕДЕЛЬНИК', 'ВТОРНИК', 'СРЕДА', 'ЧЕТВЕРГ', 'ПЯТНИЦА', 'СУББОТА'];
      const now = new Date().getDay();
      const todayTarget = daysOfWeek[now];
      const tomorrowTarget = daysOfWeek[(now + 1) % 7];

      const todayKey = keys.find(k => k.includes(todayTarget)) || keys[0];
      const tomorrowKey = keys.find(k => k.includes(tomorrowTarget)) || keys[1] || keys[0];
      const others = keys.filter(k => k !== todayKey && k !== tomorrowKey);

      return { today: todayKey, tomorrow: tomorrowKey, others: others.length ? others : keys };
    }

    function renderView() {
      document.getElementById('headerTitle').textContent = `${currentProfile.course} курс • ${currentProfile.group_name.replace('ГРУППА ', 'Группа ')}`;
      if (facultyData?.updated_times?.[currentProfile.course]) {
        document.getElementById('headerSync').textContent = `Деканат: ${facultyData.updated_times[currentProfile.course]}`;
      }

      const { today, tomorrow, others } = getDays();

      const btnToday = document.getElementById('btnToday');
      const btnTomorrow = document.getElementById('btnTomorrow');
      if (activeTab === 'today') {
        btnToday.style.background = 'var(--nav-active-bg)';
        btnToday.style.color = 'var(--nav-active-text)';
        btnTomorrow.style.background = 'transparent';
        btnTomorrow.style.color = 'var(--text-sub)';
        renderDayCards(today, document.getElementById('primaryList'), true);
      } else {
        btnTomorrow.style.background = 'var(--nav-active-bg)';
        btnTomorrow.style.color = 'var(--nav-active-text)';
        btnToday.style.background = 'transparent';
        btnToday.style.color = 'var(--text-sub)';
        renderDayCards(tomorrow, document.getElementById('primaryList'), false);
      }

      if (!selectedSecondaryDay || !others.includes(selectedSecondaryDay)) {
        selectedSecondaryDay = others[0] || '';
      }

      const scrollBox = document.getElementById('daysScroll');
      scrollBox.innerHTML = '';
      others.forEach(dKey => {
        const b = document.createElement('button');
        const isSel = dKey === selectedSecondaryDay;
        b.style.cssText = `padding: 6px 12px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; ${isSel ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}`;
        b.textContent = dKey.split(' ')[0];
        b.onclick = () => {
          selectedSecondaryDay = dKey;
          renderView();
        };
        scrollBox.appendChild(b);
      });

      renderDayCards(selectedSecondaryDay, document.getElementById('secondaryList'), false);
    }

    function switchPrimaryTab(tab) {
      activeTab = tab;
      renderView();
    }

    /* Настройки (Wizard) */
    function openWizard() {
      draftProfile = { ...currentProfile, important_subjects: [...currentProfile.important_subjects] };
      wizardStep = 1;
      document.getElementById('wizardModal').classList.add('open');
      renderWizardStep();
    }

    function closeWizard() {
      document.getElementById('wizardModal').classList.remove('open');
    }

    function renderWizardStep() {
      const body = document.getElementById('wizardBody');
      const stepLabel = document.getElementById('wizardStepLabel');
      const stepTitle = document.getElementById('wizardStepTitle');
      const backBtn = document.getElementById('wizardBackBtn');
      const nextBtn = document.getElementById('wizardNextBtn');

      backBtn.style.display = wizardStep > 1 ? 'block' : 'none';
      nextBtn.textContent = wizardStep === 4 ? 'Сохранить' : 'Далее';

      if (wizardStep === 1) {
        stepLabel.textContent = 'Шаг 1 из 4';
        stepTitle.textContent = 'Курс и тема';
        const isDark = document.documentElement.classList.contains('dark');
        body.innerHTML = `
          <div>
            <span style="font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase;">Тема</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px;">
              <button onclick="setTheme('light')" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-color); ${!isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Светлая</button>
              <button onclick="setTheme('dark')" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-color); ${isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Тёмная</button>
            </div>
          </div>
          <div>
            <span style="font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase;">Курс</span>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px;">
              ${['1','2','3','4'].map(c => `
                <button onclick="draftProfile.course='${c}'; nextWizardStep();" style="padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; border: 1px solid var(--border-color); cursor: pointer; ${draftProfile.course === c ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${c}</button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (wizardStep === 2) {
        stepLabel.textContent = 'Шаг 2 из 4';
        stepTitle.textContent = `${draftProfile.course} курс • Группа`;
        const groups = Object.keys(facultyData?.courses?.[draftProfile.course] || {});
        body.innerHTML = `
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
            ${groups.map(g => {
              const num = g.replace(/^ГРУППА\s*/i, '');
              const sel = draftProfile.group_name === g;
              return `<button onclick="draftProfile.group_name='${g}'; nextWizardStep();" style="padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700; border: 1px solid var(--border-color); cursor: pointer; ${sel ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${num}</button>`;
            }).join('')}
          </div>
        `;
      } else if (wizardStep === 3) {
        stepLabel.textContent = 'Шаг 3 из 4';
        stepTitle.textContent = 'Иностранный язык';
        const langs = [
          { id: 'EN', label: 'Английский' },
          { id: 'DE', label: 'Немецкий' },
          { id: 'FR', label: 'Французский' },
          { id: 'RKI', label: 'РКИ' },
          { id: 'ALL', label: 'Все языки' }
        ];
        body.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            ${langs.map(l => `
              <button onclick="draftProfile.foreign_lang='${l.id}'; renderWizardStep();" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); cursor: pointer; ${l.id === 'ALL' ? 'grid-column: span 2;' : ''} ${draftProfile.foreign_lang === l.id ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${l.label}</button>
            `).join('')}
          </div>
        `;
      } else if (wizardStep === 4) {
        stepLabel.textContent = 'Шаг 4 из 4';
        stepTitle.textContent = 'Важные пары';
        const subjects = new Set();
        const grp = facultyData?.courses?.[draftProfile.course]?.[draftProfile.group_name] || {};
        Object.values(grp).forEach(day => Object.values(day).forEach(list => list.forEach(l => {
          const t = l.split('\n')[0].replace(/\((лекц\.?|лаб\.?|практ\.?|сем\.?)\)/gi, '').trim();
          if (t.length > 3) subjects.add(t);
        })));

        const arr = Array.from(subjects).sort();
        body.innerHTML = arr.length ? arr.map(s => {
          const checked = draftProfile.important_subjects.includes(s);
          return `
            <div onclick="toggleImportant('${s}')" style="padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; cursor: pointer; ${checked ? 'background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4);' : 'background: var(--glass-card-subtle);'}">
              <span style="font-size: 12px; font-weight: 600;">${s}</span>
              <span style="width: 16px; height: 16px; border-radius: 50%; border: 1px solid ${checked ? '#f59e0b' : 'var(--border-color)'}; background: ${checked ? '#f59e0b' : 'transparent'};"></span>
            </div>
          `;
        }).join('') : '<div style="color: var(--text-sub); font-size: 12px;">Дисциплины не найдены</div>';
      }
    }

    function toggleImportant(subj) {
      const idx = draftProfile.important_subjects.indexOf(subj);
      if (idx > -1) draftProfile.important_subjects.splice(idx, 1);
      else draftProfile.important_subjects.push(subj);
      renderWizardStep();
    }

    function nextWizardStep() {
      if (wizardStep < 4) {
        wizardStep++;
        renderWizardStep();
      } else {
        currentProfile = { ...draftProfile };
        localStorage.setItem('bsu_profile', JSON.stringify(currentProfile));
        closeWizard();
        renderView();
      }
    }

    function prevWizardStep() {
      if (wizardStep > 1) {
        wizardStep--;
        renderWizardStep();
      }
    }

    async function init() {
      initTheme();
      const saved = localStorage.getItem('bsu_profile');
      if (saved) {
        try { currentProfile = JSON.parse(saved); } catch(e) {}
      }

      const ok = await loadData();
      if (!ok) {
        document.getElementById('headerTitle').textContent = 'Ошибка загрузки данных';
        return;
      }

      if (!currentProfile.group_name) {
        const firstGroup = Object.keys(facultyData?.courses?.[currentProfile.course] || {})[0] || '';
        currentProfile.group_name = firstGroup;
        openWizard();
      }

      renderView();
    }

    init();
  </script>
</body>
</html>
