    function getLessonActualTime(rawTimeStr, items) {
      if (items && items.some(it => /физическ|физкультур|физ-р|физвоспитан/i.test(it.title || it.raw || ''))) {
        const parsed = parseTimeSlotMinutes(rawTimeStr);
        if (parsed) {
          // 14:20 -> 14:40–16:00 (1 курс)
          if (parsed.startMin >= 14 * 60 + 10 && parsed.startMin <= 14 * 60 + 35) return '14:40–16:00';
          // 12:50 -> 13:10–14:30 (2 курс)
          if (parsed.startMin >= 12 * 60 + 40 && parsed.startMin <= 13 * 60) return '13:10–14:30';
          // 11:20 -> 10:50–12:10 (3 курс)
          if (parsed.startMin >= 11 * 60 + 10 && parsed.startMin <= 11 * 60 + 35) return '10:50–12:10';
        }
      }
      return rawTimeStr;
    }

    function getProcessedDaySlots(dayKey, groupSchedule) {
      if (!dayKey || !groupSchedule || !groupSchedule[dayKey]) return [];
      const rawSlots = groupSchedule[dayKey];
      const times = Object.keys(rawSlots);
      if (!times.length) return [];

      const slotsWithItems = times.map(timeStr => {
        const items = getLessonsForSlot(timeStr, dayKey, groupSchedule, currentProfile);
        const actualTimeStr = getLessonActualTime(timeStr, items);
        return { timeStr: actualTimeStr, items };
      });

      // Хронологическая сортировка слотов по времени начала
      slotsWithItems.sort((a, b) => {
        const ma = parseTimeSlotMinutes(a.timeStr)?.startMin || 0;
        const mb = parseTimeSlotMinutes(b.timeStr)?.startMin || 0;
        return ma - mb;
      });

      const firstIdx = slotsWithItems.findIndex(s => s.items.length > 0);
      const lastIdx = slotsWithItems.findLastIndex(s => s.items.length > 0);

      if (firstIdx === -1) return []; // Нет занятий для студента в этот день (выходной)

      // Строго от первой до последней пары студента (отсекаем висящие форточки в конце и начале дня)
      return slotsWithItems.slice(firstIdx, lastIdx + 1);
    }

    function renderLessonCards(activeSlots, isToday, isPast = false) {

                <svg class="w-3.5 h-3.5 opacity-60 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 16 14"></polyline></svg>
                <span class="truncate">Окно между парами</span>
              </span>

              <span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>

                  ${item.type ? `<span class="badge badge-sm font-bold flex-shrink-0" style="color: ${item.type.color}; background: ${item.type.bg};">${item.type.label}</span>` : ''}
                </div>

              ${item.subgroups ? `

                  ${item.subgroups.map((sg, sgIdx) => {
                    const m = sg.teacher ? sg.teacher.match(/([А-ЯЁ][а-яё]+)\s+([А-ЯЁ]\.?\s*[А-ЯЁ]\.?)/) : null;
                    let teacherName = sg.teacher || '—';
                    let rank = '';
                    if (m) {
                      let initials = m[2].replace(/\s+/g, '');
                      if (!initials.endsWith('.')) initials += '.';
                      teacherName = `${m[1]} ${initials}`;
                      rank = sg.teacher.replace(m[0], '').replace(/^[-–—•,\s]+|[-–—•,\s]+$/g, '').trim();
                    }

                    return `
                      <div class="subgroup-box min-w-0 h-full flex flex-col justify-between">
                        <div>
                          <div class="flex items-center justify-between text-[10px] font-extrabold text-base-content/60 uppercase pb-1 border-b border-base-content/5">
                            <span class="truncate">${sgIdx + 1} подгруппа</span>
                            ${sg.room ? `<span class="badge badge-ghost badge-xs font-mono font-bold flex-shrink-0">${sg.room}</span>` : ''}
                          </div>
                          <div class="text-[10px] text-base-content/55 truncate h-4 leading-4 font-medium mt-1">
                            ${rank || '&nbsp;'}
                          </div>
                        </div>
                        <div class="mt-1 min-w-0">
                          <button type="button" class="teacher-chip tap-scale w-full" onclick="event.stopPropagation(); openTeacherModal('${teacherName.replace(/'/g, "\\'")}')" title="Открыть досье преподавателя">
                            <span class="teacher-chip-icon">👤</span>
                            <span class="teacher-chip-name truncate flex-1 text-left" style="max-width: none;">${teacherName}</span>
                            <span class="teacher-chip-arrow flex-shrink-0">›</span>
                          </button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : renderLessonDetails(item.details)}
            </div>
          `;
        });

        card.innerHTML = innerContent;
        frag.appendChild(card);
      });

      return frag;
    }

    function buildDayPage(dayIndex, groupSchedule) {
      const page = document.createElement('div');
      page.className = 'schedule-page active-page';

      if (dayIndex === -1) {
        page.innerHTML = getWeekendCardHTML();
        return page;
      }

      const currentDay = currentDaysList[dayIndex];
      if (!currentDay || !currentDay.rawKey) {
        page.innerHTML = `
          <div class="card-glass animate-card" style="text-align: center; padding: 42px 20px;">
            <div style="width: 60px; height: 60px; border-radius: 20px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
              <svg style="width: 30px; height: 30px; color: var(--text-sub);" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <circle cx="12" cy="15" r="1.5" fill="currentColor"></circle>
              </svg>
            </div>
            <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 7px;">Расписание не загружено</h3>
            <p style="font-size: 13.5px; color: var(--text-sub); line-height: 1.5; max-width: 290px; margin: 0 auto;">Деканат пока не загрузил расписание на этот день</p>
          </div>
        `;
        return page;
      }

      const activeSlots = getProcessedDaySlots(currentDay.rawKey, groupSchedule);
      if (!activeSlots.length) {
        page.innerHTML = getWeekendCardHTML();
        return page;
      }

      const frag = renderLessonCards(activeSlots, currentDay.isToday, currentDay.isPast);
      page.appendChild(frag);
      return page;
    }

    function scrollCalendarToSelected(smooth = true) {
      const selectorBox = document.getElementById('calendarSelector');
      if (!selectorBox) return;
      const activeBtn = selectorBox.querySelector('.calendar-day-btn.active');
      if (!activeBtn) return;

      const todayIdx = currentDaysList.findIndex(item => item.isToday);
      const isToday = selectedDayIndex === todayIdx;
      const behavior = smooth ? 'smooth' : 'auto';

      if (isToday && todayIdx > 0) {
        // Оставляем вчерашний день отчетливо торчащим слева (~54px)
        const targetLeft = Math.max(0, activeBtn.offsetLeft - 54);
        selectorBox.scrollTo({ left: targetLeft, behavior });
      } else if (selectedDayIndex < todayIdx) {
        activeBtn.scrollIntoView({ behavior, inline: 'center', block: 'nearest' });
      } else {
        activeBtn.scrollIntoView({ behavior, inline: 'nearest', block: 'nearest' });
      }
    }

    function renderView() {
      updateHeaderGroupTitle();

      const groupSchedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
      currentDaysList = getScheduleDays(groupSchedule);

      const now = new Date();
      const isSundayToday = now.getDay() === 0;
      const sundayBanner = document.getElementById('sundayBanner');
      if (sundayBanner) {
        sundayBanner.style.display = (isSundayToday && selectedDayIndex >= 0) ? 'flex' : 'none';
      }

      if (selectedDayIndex >= currentDaysList.length) {
        selectedDayIndex = 0;
      }

      // Render Continuous Timeline Carousel (Past on left, Today in center, Future on right)
      const selectorBox = document.getElementById('calendarSelector');
      selectorBox.innerHTML = '';

      currentDaysList.forEach((d, idx) => {
        const isActive = idx === selectedDayIndex;

        const btn = document.createElement('button');
        btn.className = `calendar-day-btn tap-scale ${isActive ? 'active' : ''} ${d.isPast ? 'past-day' : ''}`;
        btn.onclick = () => selectDayIndex(idx, 'medium');

        btn.innerHTML = `
          ${d.isToday ? '<span class="calendar-today-dot"></span>' : ''}
          <span class="calendar-day-name">${d.short}</span>
          <span class="calendar-day-date">${d.dateText}</span>
        `;
        selectorBox.appendChild(btn);
      });

      scrollCalendarToSelected(currentSlideDirection !== 'none');

      updateDayHeader(selectedDayIndex, groupSchedule);

      // Запускаем / обновляем живой таймер статуса пары
      startLiveStatusTimer(groupSchedule);

      const viewport = document.getElementById('scheduleViewport');
      const oldPage = viewport.querySelector('.schedule-page.active-page');

      if (!oldPage || currentSlideDirection === 'none') {
        viewport.innerHTML = '';
        const newPage = buildDayPage(selectedDayIndex, groupSchedule);
        viewport.appendChild(newPage);
        viewport.style.height = 'auto';
        if (window.Motion?.animate) {
          const cards = Array.from(newPage.querySelectorAll('.card-glass'));
          if (cards.length > 0) {
            Motion.animate(cards, {
              transform: ['translate3d(0, 12px, 0)', 'translate3d(0, 0, 0)'],
              opacity: [0, 1]
            }, {
              delay: Motion.stagger(0.04, { startDelay: 0.05 }),
              duration: 0.48,
              ease: [0.16, 1, 0.3, 1]
            });
          }
        }
        return;
      }

      // Аппаратно ускоренное перелистывание (Zero Layout Thrashing, 60-120 FPS)
      viewport.querySelectorAll('.schedule-page.leaving-page').forEach(p => {
        if (p._motionAnim) {
          try { p._motionAnim.stop(); } catch(e) {}
        }
        p.remove();
      });

      const oldHeight = oldPage.offsetHeight || 0;
      const newPage = buildDayPage(selectedDayIndex, groupSchedule);
      oldPage.classList.remove('active-page');
      oldPage.classList.add('leaving-page');
      viewport.appendChild(newPage);

      const newHeight = newPage.offsetHeight || 0;
      if (oldHeight > 0 && newHeight > 0 && oldHeight !== newHeight) {
        viewport.style.height = oldHeight + 'px';
        viewport.style.transition = 'height 0.42s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(() => {
          viewport.style.height = newHeight + 'px';
        });
      }

      const isNext = currentSlideDirection === 'next';

      if (window.Motion?.animate) {
        if (oldPage._motionAnim) {
          try { oldPage._motionAnim.stop(); } catch(e) {}
        }

        // Уходящая страница: мягкий параллакс и растворение
        oldPage._motionAnim = Motion.animate(oldPage, {
          transform: [
            'translate3d(0%, 0, 0) scale(1)',
            isNext ? 'translate3d(-35%, 0, 0) scale(0.94)' : 'translate3d(35%, 0, 0) scale(0.94)'
          ],
          opacity: [1, 0]
        }, {
          duration: 0.40,
          ease: [0.25, 1, 0.5, 1]
        });

        oldPage._motionAnim.then(() => {
          if (oldPage.parentNode) oldPage.remove();
          viewport.style.height = 'auto';
          viewport.style.transition = '';
        });

        // Новая страница: плавный въезд с легким масштабированием
        newPage._motionAnim = Motion.animate(newPage, {
          transform: [
            isNext ? 'translate3d(35%, 0, 0) scale(0.94)' : 'translate3d(-35%, 0, 0) scale(0.94)',
            'translate3d(0%, 0, 0) scale(1)'
          ],
          opacity: [0, 1]
        }, {
          duration: 0.44,
          ease: [0.16, 1, 0.3, 1]
        });

        // Спокойное, медленное и комфортное для глаз всплытие плашек пар
        const cards = Array.from(newPage.querySelectorAll('.card-glass'));
        if (cards.length > 0) {
          Motion.animate(cards, {
            transform: ['translate3d(0, 12px, 0)', 'translate3d(0, 0, 0)'],
            opacity: [0, 1]
          }, {
            delay: Motion.stagger(0.04, { startDelay: 0.06 }),
            duration: 0.48,
            ease: [0.16, 1, 0.3, 1]
          });
        }
      } else {
        if (isNext) {
          oldPage.classList.add('page-deck-out-left');
          newPage.classList.add('page-deck-in-right');
        } else {
          oldPage.classList.add('page-deck-out-right');
          newPage.classList.add('page-deck-in-left');
        }

        setTimeout(() => {
          if (oldPage.parentNode) oldPage.remove();
          newPage.classList.remove('page-deck-in-right', 'page-deck-in-left');
          viewport.style.height = 'auto';
          viewport.style.transition = '';
        }, 440);
      }
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    function setupSwipeGestures() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      main.addEventListener('touchstart', e => {
        if (e.touches && e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }
      }, { passive: true });

      main.addEventListener('touchend', e => {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        const modal = document.getElementById('settingsModal');
        if (modal && modal.classList.contains('open')) return;

        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const deltaTime = Date.now() - touchStartTime;

        if (Math.abs(deltaX) > 42 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3 && deltaTime < 700) {
          const isSundayToday = new Date().getDay() === 0;

          if (deltaX < 0) {
            // Swipe Left -> Next day
            if (selectedDayIndex === -1) {
              selectDayIndex(0, 'heavy');
            } else if (selectedDayIndex < currentDaysList.length - 1) {
              selectDayIndex(selectedDayIndex + 1, 'heavy');
            }
          } else if (deltaX > 0) {
            // Swipe Right -> Previous day
            if (selectedDayIndex > 0) {
              selectDayIndex(selectedDayIndex - 1, 'heavy');
            } else if (selectedDayIndex === 0 && isSundayToday) {
              selectDayIndex(-1, 'heavy');
            }
          }
        }
      }, { passive: true });

      window.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          closeSettingsModal();
          closeTeacherModal();
          return;
        }

        const openModal = document.querySelector('.modal-overlay.open');
        if (openModal) return;
        const isSundayToday = new Date().getDay() === 0;

        if (e.key === 'ArrowRight') {
          if (selectedDayIndex === -1) {
            selectDayIndex(0, 'medium');
          } else if (selectedDayIndex < currentDaysList.length - 1) {
            selectDayIndex(selectedDayIndex + 1, 'medium');
          }
        } else if (e.key === 'ArrowLeft') {
          if (selectedDayIndex > 0) {
            selectDayIndex(selectedDayIndex - 1, 'medium');
          } else if (selectedDayIndex === 0 && isSundayToday) {
            selectDayIndex(-1, 'medium');
          }
        }
      });
    }

    async function init() {
      initTheme();
      setupSwipeGestures();

      const savedProfile = localStorage.getItem('bsu_profile');
      if (savedProfile) {
        try {
          currentProfile = JSON.parse(savedProfile);
          if (currentProfile.foreign_lang === 'ALL') currentProfile.foreign_lang = null;
        } catch(e) {}
      }

      const [okSchedule] = await Promise.all([
        loadData(),
        loadTeachersInfo()
      ]);

      if (!okSchedule) {
        document.getElementById('headerTitle').textContent = 'Ошибка загрузки расписания';
        return;
      }

      initTeachersCatalog();

      const groupSchedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
      selectedDayIndex = findInitialDayIndex(groupSchedule);

      const isSetupDone = localStorage.getItem('bsu_setup_completed');
      if (!isSetupDone || !currentProfile.group_name) {
        openFirstLaunchWizard();
      } else {
        renderView();
      }
    }

    init();

    // ─── Service Worker (Offline PWA + Auto Update) ───────────────────────────
    if ('caches' in window) {
      caches.keys().then(keys => {
        keys.forEach(k => {
          if (k !== 'bsu-schedule-v12') caches.delete(k);
        });
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=12')
          .then(reg => {
            reg.update();
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage({ action: 'skipWaiting' });
                  }
                });
              }
            });
          })
          .catch(err => {
            console.warn('SW registration failed:', err);
          });

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }

  </script>
