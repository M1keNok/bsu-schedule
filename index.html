<!DOCTYPE html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Расписание Геофак БГУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(180deg, #f1f4f9 0%, #e5ebf4 100%);
      --text-main: #0f172a;
      --text-sub: #64748b;
      --glass-card: rgba(255, 255, 255, 0.76);
      --glass-card-subtle: rgba(255, 255, 255, 0.52);
      --glass-border: rgba(255, 255, 255, 0.95);
      --glass-inner-bevel: inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
      --card-shadow: 0 6px 22px -3px rgba(0, 0, 0, 0.05);
      --nav-active-bg: #0f172a;
      --nav-active-text: #ffffff;
      --border-color: rgba(0, 0, 0, 0.06);
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
    }

    .dark {
      --bg-gradient: linear-gradient(180deg, #090c13 0%, #0d121c 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --glass-card: rgba(20, 25, 38, 0.74);
      --glass-card-subtle: rgba(27, 34, 51, 0.55);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-inner-bevel: inset 0 1px 1px 0 rgba(255, 255, 255, 0.14);
      --card-shadow: 0 10px 28px -4px rgba(0, 0, 0, 0.55);
      --nav-active-bg: #f8fafc;
      --nav-active-text: #090c13;
      --border-color: rgba(255, 255, 255, 0.08);
      --accent-emerald: #34d399;
      --accent-amber: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      transition: background 0.35s ease, color 0.35s ease;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .tap-scale {
      transition: transform 0.14s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.14s ease;
      cursor: pointer;
    }
    .tap-scale:active {
      transform: scale(0.96);
      opacity: 0.88;
    }

    .header-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: max(10px, env(safe-area-inset-top, 10px)) 16px 8px;
    }

    .header-glass {
      background: var(--glass-card);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius: 22px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      transform: translateZ(0);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    .card-glass {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      box-shadow: var(--card-shadow), var(--glass-inner-bevel);
      border-radius: 20px;
      padding: 14px 16px;
      transform: translateZ(0);
      contain: content;
      transition: background 0.25s ease, border-color 0.25s ease;
    }

    .badge-subtle {
      background: var(--glass-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.5px 7.5px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .active-lesson-card {
      position: relative;
      border-radius: 20px;
      padding: 1.5px;
      overflow: hidden;
      contain: paint;
      box-shadow: 0 10px 24px -4px rgba(16, 185, 129, 0.25);
    }

    .active-lesson-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(
        transparent,
        rgba(16, 185, 129, 0.1) 40%,
        rgba(16, 185, 129, 0.95) 50%,
        transparent 60%
      );
      animation: rotateBeam 3.6s linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes rotateBeam {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .active-lesson-inner {
      position: relative;
      z-index: 1;
      background: var(--glass-card);
      border-radius: 18.5px;
      padding: 14px 16px;
      box-shadow: var(--glass-inner-bevel);
    }

    .important-card {
      position: relative;
    }
    .important-card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      border: 1.5px solid rgba(245, 158, 11, 0.55);
      animation: pulseAura 3s ease-in-out infinite;
      pointer-events: none;
      will-change: opacity;
    }

    @keyframes pulseAura {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.85; }
    }

    @keyframes springCascade {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-card {
      animation: springCascade 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .subgroups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .subgroup-box {
      background: var(--glass-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: var(--glass-card);
      backdrop-filter: blur(28px) saturate(200%);
      -webkit-backdrop-filter: blur(28px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 30px 30px 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.3);
      transform: translateY(100%);
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .modal-overlay.open .modal-sheet {
      transform: translateY(0);
    }

    .modal-grabber {
      width: 36px;
      height: 5px;
      border-radius: 10px;
      background: var(--text-sub);
      opacity: 0.35;
      margin: 0 auto 4px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .calendar-selector {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      background: var(--glass-card-subtle);
      border: 1px solid var(--border-color);
      border-radius: 17px;
      padding: 4px;
      box-shadow: var(--glass-inner-bevel);
      transform: translateZ(0);
    }

    .calendar-day-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5px;
      padding: 7px 2px 6px;
      border-radius: 13px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-main);
      position: relative;
      transition: background 0.18s cubic-bezier(0.16, 1, 0.3, 1), color 0.18s, box-shadow 0.18s;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .calendar-day-btn.active {
      background: var(--nav-active-bg);
      color: var(--nav-active-text);
      border-color: var(--border-color);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }

    .calendar-day-name {
      font-size: 12.5px;
      font-weight: 800;
      line-height: 1.1;
    }

    .calendar-day-date {
      font-size: 9.5px;
      font-family: monospace;
      font-weight: 600;
      opacity: 0.65;
      line-height: 1;
    }

    .calendar-day-btn.active .calendar-day-date {
      opacity: 0.9;
    }

    .calendar-today-dot {
      position: absolute;
      top: 4px;
      right: 4.5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.7);
    }

    .past-day-card {
      opacity: 0.88;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div class="header-glass">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <div style="width: 36px; height: 36px; border-radius: 12px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg style="width: 18px; height: 18px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor"></polygon>
          </svg>
        </div>
        <div style="min-width: 0;">
          <div id="headerTitle" style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Загрузка...</div>
          <div style="display: flex; align-items: center; gap: 5px; margin-top: 2px;">
            <span style="width: 6px; height: 6px; border-radius: 50%; background: #10b981; animation: pulseAura 2s infinite;"></span>
            <span id="headerSync" style="font-size: 10.5px; color: var(--text-sub); font-weight: 500;">Обновлено: загрузка...</span>
          </div>
        </div>
      </div>

      <button onclick="openSettingsModal()" class="tap-scale" style="padding: 7px 13px; border-radius: 12px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-main); font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 5.5px;">
        <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Настройки</span>
      </button>
    </div>
  </header>

  <main id="mainContent" style="flex: 1; padding: 6px 16px 20px; max-width: 480px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; touch-action: pan-y;">
    
    <div id="sundayBanner" style="display: none; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 16px; background: rgba(245, 158, 11, 0.09); border: 1px solid rgba(245, 158, 11, 0.25); color: var(--text-main); font-size: 11.5px; font-weight: 600; line-height: 1.35;" class="animate-card">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 16px; line-height: 1;">☕</span>
        <span>Сегодня воскресенье — выходной</span>
      </div>
      <button onclick="selectDayIndex(-1)" class="tap-scale" style="padding: 4px 10px; border-radius: 10px; background: rgba(245, 158, 11, 0.18); border: 1px solid rgba(245, 158, 11, 0.35); color: var(--text-main); font-size: 11px; font-weight: 700; cursor: pointer;">
        Сегодня
      </button>
    </div>

    <div id="calendarSelector" class="calendar-selector"></div>

    <div id="dayHeaderRow" style="display: flex; align-items: center; justify-content: space-between; margin-top: 1px; padding: 0 2px;">
      <div style="display: flex; align-items: center; gap: 7px; flex-wrap: wrap;">
        <h2 id="dayFullTitle" style="font-size: 15px; font-weight: 800; letter-spacing: -0.2px;">...</h2>
        <div id="dayStatusBadge"></div>
      </div>
      <div id="dayLessonsCount" style="font-size: 11.5px; font-weight: 700; color: var(--text-sub);"></div>
    </div>

    <div id="scheduleList" style="display: flex; flex-direction: column; gap: 10px; min-height: 200px;"></div>

  </main>

  <div id="settingsModal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-grabber"></div>

      <div style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">
        <div>
          <span id="modalCategoryLabel" style="font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--text-sub); letter-spacing: 0.5px;">Параметры</span>
          <h3 id="modalHeading" style="font-size: 16px; font-weight: 800; margin-top: 1px;">Настройки расписания</h3>
        </div>
        <button onclick="closeSettingsModal()" class="tap-scale" style="background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-sub); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
          <svg style="width: 14px; height: 14px;" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <div id="modalBody" class="no-scrollbar" style="overflow-y: auto; max-height: 60vh; display: flex; flex-direction: column; gap: 16px; padding-right: 2px;"></div>

      <div id="modalFooter" style="display: flex; gap: 8px; border-top: 1px solid var(--border-color); padding-top: 10px;"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#090c13');
    }

    let facultyData = null;
    let currentProfile = {
      course: "1",
      group_name: "",
      foreign_lang: "ALL",
      important_subjects: []
    };

    const DAYS_OF_WEEK = [
      { index: 1, short: 'Пн', name: 'ПОНЕДЕЛЬНИК', full: 'Понедельник' },
      { index: 2, short: 'Вт', name: 'ВТОРНИК', full: 'Вторник' },
      { index: 3, short: 'Ср', name: 'СРЕДА', full: 'Среда' },
      { index: 4, short: 'Чт', name: 'ЧЕТВЕРГ', full: 'Четверг' },
      { index: 5, short: 'Пт', name: 'ПЯТНИЦА', full: 'Пятница' },
      { index: 6, short: 'Сб', name: 'СУББОТА', full: 'Суббота' }
    ];

    const monthsGenitive = [
      'января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
      'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'
    ];

    let selectedDayIndex = 0;
    
    let modalMode = 'unified';
    let wizardStep = 1;
    let draftProfile = { ...currentProfile };

    function cleanHyphens(text) {
      if (!text) return '';
      const legit = [
        'социально-эконом',
        'физико-географ',
        'экономико-географ',
        'научно-технич',
        'аппаратно-программ',
        'гис-картограф',
        'гис-технолог',
        'соц-эконом',
        'препод-стаж',
        'препод.-стаж',
        'творонович-севрук'
      ];
      let res = text.replace(/[а-яА-ЯёЁa-zA-Z]+[-–—][а-яА-ЯёЁa-zA-Z]+/g, m => {
        const lower = m.toLowerCase();
        if (legit.some(l => lower.includes(l))) {
          return m.replace(/[-–—]/g, '__HYPH__');
        }
        return m;
      });
      while (/([а-яА-ЯёЁa-zA-Z])[-–—]+([а-яА-ЯёЁa-zA-Z])/.test(res)) {
        res = res.replace(/([а-яА-ЯёЁa-zA-Z])[-–—]+([а-яА-ЯёЁa-zA-Z])/g, '$1$2');
      }
      return res.replace(/__HYPH__/g, '-');
    }

    function formatLessonTitle(rawTitle) {
      if (!rawTitle) return 'Пара';
      let title = rawTitle.replace(/\((лекц\.?|лаб\.?|практ\.?|сем\.?|уср|фак\.?\s*зан\.?)\)/gi, '').trim();
      title = title.replace(/\s+(препод\.?-стаж[её]р|ст\.?\s*препод|доцент|профессор).*$/gi, '');
      title = title.replace(/\s+/g, ' ');

      title = cleanHyphens(title);

      const typoFixes = [
        [/гибробиолог[а-яё]*/gi, 'гидробиология'],
        [/гидро-биолог[а-яё]*/gi, 'гидробиология'],
        [/гидро-эколог[а-яё]*/gi, 'гидроэкология'],
        [/автоматизи-?рова[н]+ые/gi, 'автоматизированные'],
        [/геоинформа-?ци[о]?нное/gi, 'геоинформационное'],
        [/иностраный\s+язык/gi, 'иностранный язык'],
        [/генезис\s+месторожде-?ни[еяй]/gi, 'генезис месторождений'],
        [/картография\s+препод.*/gi, 'картография'],
        [/профессио\s+нальн/gi, 'профессиональн'],
        [/землеведе\s+ние/gi, 'землеведение'],
        [/историче\s+ская/gi, 'историческая'],
        [/иностран\s+ный/gi, 'иностранный'],
        [/социально-экономическая\s*$/gi, 'социально-экономическая география'],
      ];
      typoFixes.forEach(([re, rep]) => { title = title.replace(re, rep); });
      title = title.replace(/^[-–—•,\s]+|[-–—•,\s]+$/g, '').trim();

      const aliases = [
        { match: /безопасн(ость|\.)?\s*жизнедеят|бжд|бжч/i, to: 'БЖЧ' },
        { match: /дистанционн.*зонд|дзз/i, to: 'ДЗЗ' },
        { match: /введение\s+в\s+социально-эконом|социально-эконом.*геогр|соц.*эконом/i, to: 'Соц-эконом география' },
        { match: /информатик/i, to: 'Информатика' },
        { match: /основы\s*эколог|охрана\s*природ|эколог/i, to: 'Экология' },
        { match: /высш(ая|\.)?\s*матем/i, to: 'Вышмат' },
        { match: /матем(атическ(ий|\.))?\s*анализ/i, to: 'Матанализ' },
        { match: /истор(ия|\.)?\s*беларус/i, to: 'История Беларуси' },
        { match: /физическ(ая|\.)?\s*культ/i, to: 'Физкультура' },
        { match: /топограф(ия|\.)?.*геодез|топография\s+с\s+основами/i, to: 'Топография и геодезия' },
        { match: /геоинформационн|гис/i, to: 'ГИС-технологии' },
        { match: /метеоролог/i, to: 'Метеорология и климат' },
        { match: /почвоведен|почвовед/i, to: 'Почвоведение' },
        { match: /геолог/i, to: 'Геология' },
        { match: /геоморфолог|геоморфол/i, to: 'Геоморфология' },
        { match: /иностранн(ый|\.)?\s*язык\s*\(?проф/i, to: 'Иностранный язык (проф.)' },
        { match: /^иностранн(ый|\.)?\s*язык$/i, to: 'Иностранный язык' },
        { match: /русск(ий|\.)?\s*язык\s*как\s*иностр/i, to: 'Русский как иностранный' },
        { match: /информационн(ый|\.)?\s*час/i, to: 'Информационный час' },
        { match: /общее\s*землеведен/i, to: 'Общее землеведение' },
      ];

      for (const item of aliases) {
        if (item.match.test(title)) return item.to;
      }

      if (title.length > 2) {
        const words = title.split(' ');
        const acronyms = new Set(['ГИС', 'ДЗЗ', 'БЖЧ', 'БЖД', 'СУБД', 'УСР', 'РКИ']);
        title = words.map((w, i) => {
          if (acronyms.has(w.toUpperCase())) return w.toUpperCase();
          if (i === 0) return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
          return w.toLowerCase();
        }).join(' ');
      }

      return title;
    }

    function parseLessonRaw(raw) {
      if (!raw) return { title: 'Пара', type: null, lines: [], raw: '' };
      let lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
      if (!lines.length) return { title: 'Пара', type: null, lines: [], raw };

      let startIdx = 0;
      let weekTag = null;
      while (startIdx < lines.length) {
        const l = lines[startIdx];
        if (/^\d{1,2}[.:]\d{2}\s*[-–—]\s*\d{1,2}[.:]\d{2}$/.test(l)) {
          startIdx++;
          continue;
        }
        if (/^(не)?четная\s+неделя$/i.test(l)) {
          weekTag = l.toLowerCase();
          startIdx++;
          continue;
        }
        break;
      }
      if (startIdx >= lines.length) startIdx = 0;

      let titleLine = lines[startIdx];
      titleLine = titleLine.replace(/^\d{1,2}[.:]\d{2}\s*[-–—]\s*\d{1,2}[.:]\d{2}\s*/, '');

      let nextIdx = startIdx + 1;
      while (nextIdx < lines.length) {
        const nxt = lines[nextIdx];
        if (/^(доцент|ст\.?\s*препод|преподават|профессор|ауд\.?|каб\.?|http|зачет|\([а-яёА-ЯЁ\s.,]+\))/i.test(nxt)) {
          break;
        }
        const u = titleLine.toUpperCase().trim();
        if (/^(ОБЩЕЕ|ОБЩЕЕ\s+ЗЕМЛЕВЕДЕ|ИСТОРИЧЕ|ЯЗЫК\s+ПРОФЕССИО|СОЦИАЛЬНО-ЭКОНОМИЧЕСКАЯ|ГРУНТОВЕ|ИНФОРМАЦИОННЫЙ|ГЕОИНФОРМАЦИОННОЕ)$/.test(u) || /иностранн.*\(проф/i.test(u)) {
          titleLine += ' ' + nxt;
          nextIdx++;
          continue;
        }
        break;
      }

      const title = formatLessonTitle(titleLine);
      const lType = detectLessonType(raw);
      const remainingLines = lines.slice(nextIdx);
      if (weekTag) remainingLines.unshift(weekTag);

      return {
        title,
        type: lType,
        lines: remainingLines,
        raw
      };
    }

    function detectLessonType(text) {
      if (/лекц/i.test(text)) return { label: 'Лекция', color: '#10b981', bg: 'rgba(16,185,129,0.1)' };
      if (/лаб/i.test(text)) return { label: 'Лабораторная', color: '#6366f1', bg: 'rgba(99,102,241,0.1)' };
      if (/практ/i.test(text)) return { label: 'Практика', color: '#14b8a6', bg: 'rgba(20,184,166,0.1)' };
      if (/сем/i.test(text)) return { label: 'Семинар', color: '#f59e0b', bg: 'rgba(245,158,11,0.1)' };
      return null;
    }

    function initTheme() {
      const saved = localStorage.getItem('bsu_theme') || 'dark';
      document.documentElement.classList.toggle('dark', saved === 'dark');
    }

    function setTheme(mode) {
      document.documentElement.classList.toggle('dark', mode === 'dark');
      localStorage.setItem('bsu_theme', mode);
      if (modalMode === 'wizard') renderWizardStep();
      else renderUnifiedSettings();
    }

    async function loadData() {
      try {
        const res = await fetch('schedule_data.json?t=' + Date.now());
        if (!res.ok) throw new Error();
        facultyData = await res.json();
        return true;
      } catch (e) {
        return false;
      }
    }

    function cleanTeacherAndRoom(str) {
      if (!str) return { teacher: '', room: null };
      let s = str.replace(/^[12]\s*(?:п\/г|подгр\.?|подгруппа)\s*/i, '').trim();
      const m = s.match(/(?:ауд\.?|спорткомплекс|каб\.?)\s*([0-9/\-а-яА-Яa-zA-Z]+|\S+)/i);
      let room = null;
      if (m) {
        room = m[0].trim();
        s = s.replace(m[0], '').trim();
      }
      s = s.replace(/^[-–—•,\s]+|[-–—•,\s]+$/g, '').trim();
      return { teacher: s, room };
    }

    function filterByLang(text, lang) {
      if (!lang || lang === 'ALL') return true;
      const lower = text.toLowerCase();
      const map = {
        'EN': ['нем', 'немец', 'франц', 'исп', 'рки'],
        'DE': ['англ', 'франц', 'исп', 'рки'],
        'FR': ['англ', 'нем', 'немец', 'исп', 'рки'],
        'RKI': ['англ', 'нем', 'немец', 'франц', 'исп'],
      };
      return !(map[lang] && map[lang].some(marker => lower.includes(marker)));
    }

    function parseLessons(list) {
      if (!list || !list.length) return [];
      const kept = list.filter(l => filterByLang(l, currentProfile.foreign_lang));
      if (!kept.length) return [];

      const parsedItems = kept.map(parseLessonRaw);

      if (parsedItems.length === 2 && parsedItems[0].title.toLowerCase() === parsedItems[1].title.toLowerCase()) {
        const lType = parsedItems[0].type || parsedItems[1].type;
        return [{
          title: parsedItems[0].title,
          type: lType,
          subgroups: [
            cleanTeacherAndRoom(parsedItems[0].lines.join(' ')),
            cleanTeacherAndRoom(parsedItems[1].lines.join(' '))
          ]
        }];
      }

      return parsedItems.map(p => {
        const lines = p.lines;
        const l1 = lines.find(l => /1\s*(?:п\/г|подгр)/i.test(l));
        const l2 = lines.find(l => /2\s*(?:п\/г|подгр)/i.test(l));

        if (l1 && l2) {
          return {
            title: p.title,
            type: p.type,
            subgroups: [cleanTeacherAndRoom(l1), cleanTeacherAndRoom(l2)]
          };
        }

        const roomMatch = p.raw.match(/(?:ауд\.?|спорткомплекс|каб\.?)\s*([0-9/\-а-яА-Яa-zA-Z]+|\S+)/i);
        return {
          title: p.title,
          type: p.type,
          room: roomMatch ? roomMatch[0] : null,
          details: lines.join(' • ')
        };
      });
    }

    function isLessonLive(timeSlot) {
      const m = timeSlot.match(/(\d{2})[:.](\d{2})[–-](\d{2})[:.](\d{2})/);
      if (!m) return false;
      const now = new Date();
      const cur = now.getHours() * 60 + now.getMinutes();
      const start = parseInt(m[1]) * 60 + parseInt(m[2]);
      const end = parseInt(m[3]) * 60 + parseInt(m[4]);
      return cur >= start && cur <= end;
    }

    function getDayInfo(dayDef, groupSchedule) {
      const keys = Object.keys(groupSchedule || {});
      const rawKey = keys.find(k => k.toUpperCase().includes(dayDef.name));

      const now = new Date();
      let dateText = '—';
      let dayNum = null;
      let monthNum = null;
      let yearNum = now.getFullYear();

      if (rawKey) {
        const m = rawKey.match(/(\d{1,2})[.](\d{1,2})(?:[.](\d{2,4}))?/);
        if (m) {
          dayNum = parseInt(m[1], 10);
          monthNum = parseInt(m[2], 10);
          if (m[3]) {
            yearNum = parseInt(m[3], 10);
            if (yearNum < 100) yearNum += 2000;
          } else {
            if (now.getMonth() === 11 && monthNum === 1) yearNum++;
            else if (now.getMonth() === 0 && monthNum === 12) yearNum--;
          }
          dateText = (dayNum < 10 ? '0' + dayNum : dayNum) + '.' + (monthNum < 10 ? '0' + monthNum : monthNum);
        }
      }

      let isToday = false;
      let isTomorrow = false;
      let isYesterday = false;
      let isPast = false;
      let formattedDate = '';

      if (dayNum && monthNum) {
        const schedDate = new Date(yearNum, monthNum - 1, dayNum);
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.round((schedDate.getTime() - todayDate.getTime()) / (1000 * 60 * 60 * 24));
        isToday = diffDays === 0;
        isTomorrow = diffDays === 1;
        isYesterday = diffDays === -1;
        isPast = diffDays < 0;
        formattedDate = dayNum + ' ' + monthsGenitive[monthNum - 1];
      } else {
        const todayDayOfWeek = now.getDay();
        isToday = (todayDayOfWeek === dayDef.index);
        isTomorrow = ((todayDayOfWeek + 1) % 7 === dayDef.index);
        isYesterday = ((todayDayOfWeek + 6) % 7 === dayDef.index);
        isPast = todayDayOfWeek > dayDef.index && todayDayOfWeek !== 0;
      }

      return {
        dayDef,
        rawKey,
        dateText,
        isToday,
        isTomorrow,
        isYesterday,
        isPast,
        formattedDate
      };
    }

    function formatLessonsCount(count) {
      if (!count) return 'Выходной';
      const lastTwo = count % 100;
      const lastOne = count % 10;
      if (lastTwo >= 11 && lastTwo <= 19) return `${count} пар`;
      if (lastOne === 1) return `${count} пара`;
      if (lastOne >= 2 && lastOne <= 4) return `${count} пары`;
      return `${count} пар`;
    }

    function selectDayIndex(index) {
      const isSundayToday = new Date().getDay() === 0;
      if (index === -1 && !isSundayToday) return;
      if (index < -1 || index >= DAYS_OF_WEEK.length) return;
      if (selectedDayIndex === index) return;
      selectedDayIndex = index;
      triggerHaptic('selection');
      renderView();
    }

    function triggerHaptic(type = 'light') {
      try {
        const haptic = window.Telegram?.WebApp?.HapticFeedback;
        if (haptic) {
          if (type === 'selection') {
            haptic.selectionChanged();
          } else {
            haptic.impactOccurred(type);
          }
        }
      } catch (e) {}
    }

    function findInitialDayIndex(groupSchedule) {
      const now = new Date();
      const dayOfWeek = now.getDay(); // 0 is Sunday, 1..6 is Mon..Sat

      if (dayOfWeek === 0) {
        return -1; // Sunday!
      }

      for (let i = 0; i < DAYS_OF_WEEK.length; i++) {
        const info = getDayInfo(DAYS_OF_WEEK[i], groupSchedule);
        if (info.isToday) {
          return i;
        }
      }

      const fallback = dayOfWeek - 1;
      if (fallback >= 0 && fallback < DAYS_OF_WEEK.length) {
        return fallback;
      }
      return 0;
    }

      });

    function renderUnifiedSettings() {

      const isDark = document.documentElement.classList.contains('dark');
      const groups = Object.keys(facultyData?.courses?.[draftProfile.course] || {});
      const subjects = extractAllSubjectsForGroup(draftProfile.course, draftProfile.group_name);

      const langs = [
        { id: 'ALL', label: 'Все языки' },
        { id: 'EN', label: 'Английский' },
        { id: 'DE', label: 'Немецкий' },
        { id: 'FR', label: 'Французский' },
        { id: 'RKI', label: 'РКИ' }
      ];

      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <div>
          <div class="section-title">Тема оформления</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button onclick="setTheme('light')" class="tap-scale" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${!isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Светлая</button>
            <button onclick="setTheme('dark')" class="tap-scale" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Тёмная</button>
          </div>
        </div>

        <div>
          <div class="section-title">Курс</div>
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
            ${['1','2','3','4'].map(c => `
              <button onclick="draftProfile.course='${c}'; onCourseChangedUnified('${c}');" class="tap-scale" style="padding: 12px 6px; border-radius: 12px; font-size: 15px; font-weight: 800; border: 1px solid var(--border-color); ${draftProfile.course === c ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${c}</button>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="section-title">Группа (${draftProfile.course} курс)</div>
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
            ${groups.map(g => {
              const num = g.replace(/^ГРУППА\s*/i, '');
              const sel = draftProfile.group_name === g;
              return `<button onclick="draftProfile.group_name='${g}'; renderUnifiedSettings();" class="tap-scale" style="padding: 10px 4px; border-radius: 12px; font-size: 13px; font-weight: 700; border: 1px solid var(--border-color); ${sel ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${num}</button>`;
            }).join('')}
          </div>
        </div>

        <div>
          <div class="section-title">Иностранный язык</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            ${langs.map(l => `
              <button onclick="draftProfile.foreign_lang='${l.id}'; renderUnifiedSettings();" class="tap-scale" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${l.id === 'ALL' ? 'grid-column: span 2;' : ''} ${draftProfile.foreign_lang === l.id ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${l.label}</button>
            `).join('')}
          </div>
        </div>

        <div>
          <div class="section-title">Важные пары (подсветка в расписании)</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            ${subjects.length ? subjects.map(s => {
              const checked = draftProfile.important_subjects.includes(s);
              return `
                <div onclick="toggleImportantUnified('${s}')" class="tap-scale" style="padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; ${checked ? 'background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4);' : 'background: var(--glass-card-subtle);'}">
                  <span style="font-size: 12px; font-weight: 600; padding-right: 8px;">${s}</span>
                  <span style="width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid ${checked ? '#f59e0b' : 'var(--border-color)'}; background: ${checked ? '#f59e0b' : 'transparent'}; flex-shrink: 0;"></span>
                </div>
              `;
            }).join('') : '<div style="color: var(--text-sub); font-size: 12px; padding: 6px;">Дисциплины не найдены</div>'}
          </div>
        </div>
      `;

      const footer = document.getElementById('modalFooter');
      footer.innerHTML = `
        <button onclick="closeSettingsModal()" class="tap-scale" style="flex: 1; padding: 12px; border-radius: 14px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-main); font-size: 13px; font-weight: 700;">Отмена</button>
        <button onclick="saveUnifiedProfile()" class="tap-scale" style="flex: 2; padding: 12px; border-radius: 14px; background: var(--nav-active-bg); border: none; color: var(--nav-active-text); font-size: 13px; font-weight: 700;">Сохранить</button>
      `;
    }

    function onCourseChangedUnified(newCourse) {
      const availGroups = Object.keys(facultyData?.courses?.[newCourse] || {});
      if (!availGroups.includes(draftProfile.group_name)) {
        draftProfile.group_name = availGroups[0] || '';
      }
      renderUnifiedSettings();
    }

    function toggleImportantUnified(subj) {
      const idx = draftProfile.important_subjects.indexOf(subj);
      if (idx > -1) draftProfile.important_subjects.splice(idx, 1);
      else draftProfile.important_subjects.push(subj);
      renderUnifiedSettings();
    }

    function saveUnifiedProfile() {
      currentProfile = { ...draftProfile };
      localStorage.setItem('bsu_profile', JSON.stringify(currentProfile));
      closeSettingsModal();
      const groupSchedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
      selectedDayIndex = findInitialDayIndex(groupSchedule);
      renderView();
    }

    function renderWizardStep() {
      document.getElementById('modalCategoryLabel').textContent = `Шаг ${wizardStep} из 4`;
      const body = document.getElementById('modalBody');
      const footer = document.getElementById('modalFooter');

      if (wizardStep === 1) {
        document.getElementById('modalHeading').textContent = 'Курс и тема';
        const isDark = document.documentElement.classList.contains('dark');
        body.innerHTML = `
          <div>
            <div class="section-title">Тема оформления</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              <button onclick="setTheme('light')" class="tap-scale" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${!isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Светлая</button>
              <button onclick="setTheme('dark')" class="tap-scale" style="padding: 10px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${isDark ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-sub);'}">Тёмная</button>
            </div>
          </div>
          <div>
            <div class="section-title">Курс</div>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
              ${['1','2','3','4'].map(c => `
                <button onclick="draftProfile.course='${c}'; nextWizardStep();" class="tap-scale" style="padding: 15px; border-radius: 14px; font-size: 17px; font-weight: 800; border: 1px solid var(--border-color); ${draftProfile.course === c ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${c}</button>
              `).join('')}
            </div>
          </div>
        `;
      } else if (wizardStep === 2) {
        document.getElementById('modalHeading').textContent = `${draftProfile.course} курс • Группа`;
        const groups = Object.keys(facultyData?.courses?.[draftProfile.course] || {});
        body.innerHTML = `
          <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">
            ${groups.map(g => {
              const num = g.replace(/^ГРУППА\s*/i, '');
              const sel = draftProfile.group_name === g;
              return `<button onclick="draftProfile.group_name='${g}'; nextWizardStep();" class="tap-scale" style="padding: 13px; border-radius: 12px; font-size: 14px; font-weight: 700; border: 1px solid var(--border-color); ${sel ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${num}</button>`;
            }).join('')}
          </div>
        `;
      } else if (wizardStep === 3) {
        document.getElementById('modalHeading').textContent = 'Иностранный язык';
        const langs = [
          { id: 'ALL', label: 'Все языки' },
          { id: 'EN', label: 'Английский' },
          { id: 'DE', label: 'Немецкий' },
          { id: 'FR', label: 'Французский' },
          { id: 'RKI', label: 'РКИ' }
        ];
        body.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            ${langs.map(l => `
              <button onclick="draftProfile.foreign_lang='${l.id}'; renderWizardStep();" class="tap-scale" style="padding: 11px; border-radius: 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--border-color); ${l.id === 'ALL' ? 'grid-column: span 2;' : ''} ${draftProfile.foreign_lang === l.id ? 'background: var(--nav-active-bg); color: var(--nav-active-text);' : 'background: var(--glass-card-subtle); color: var(--text-main);'}">${l.label}</button>
            `).join('')}
          </div>
        `;
      } else if (wizardStep === 4) {
        document.getElementById('modalHeading').textContent = 'Важные пары';
        const subjects = extractAllSubjectsForGroup(draftProfile.course, draftProfile.group_name);
        body.innerHTML = subjects.length ? subjects.map(s => {
          const checked = draftProfile.important_subjects.includes(s);
          return `
            <div onclick="toggleImportantWizard('${s}')" class="tap-scale" style="padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; ${checked ? 'background: rgba(245,158,11,0.12); border-color: rgba(245,158,11,0.4);' : 'background: var(--glass-card-subtle);'}">
              <span style="font-size: 12px; font-weight: 600; padding-right: 8px;">${s}</span>
              <span style="width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid ${checked ? '#f59e0b' : 'var(--border-color)'}; background: ${checked ? '#f59e0b' : 'transparent'}; flex-shrink: 0;"></span>
            </div>
          `;
        }).join('') : '<div style="color: var(--text-sub); font-size: 12px; padding: 6px;">Дисциплины не найдены</div>';
      }

      footer.innerHTML = `
        <button onclick="prevWizardStep()" class="tap-scale" style="flex: 1; padding: 12px; border-radius: 14px; background: var(--glass-card-subtle); border: 1px solid var(--border-color); color: var(--text-main); font-size: 13px; font-weight: 700; ${wizardStep === 1 ? 'display: none;' : ''}">Назад</button>
        <button onclick="nextWizardStep()" class="tap-scale" style="flex: 2; padding: 12px; border-radius: 14px; background: var(--nav-active-bg); border: none; color: var(--nav-active-text); font-size: 13px; font-weight: 700;">${wizardStep === 4 ? 'Завершить' : 'Далее'}</button>
      `;
    }

    function toggleImportantWizard(subj) {
      const idx = draftProfile.important_subjects.indexOf(subj);
      if (idx > -1) draftProfile.important_subjects.splice(idx, 1);
      else draftProfile.important_subjects.push(subj);
      renderWizardStep();
    }

    function nextWizardStep() {
      if (wizardStep < 4) {
        wizardStep++;
        renderWizardStep();
      } else {
        currentProfile = { ...draftProfile };
        localStorage.setItem('bsu_profile', JSON.stringify(currentProfile));
        localStorage.setItem('bsu_setup_completed', 'true');
        closeSettingsModal();
        const groupSchedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
        selectedDayIndex = findInitialDayIndex(groupSchedule);
        renderView();
      }
    }

    function prevWizardStep() {
      if (wizardStep > 1) {
        wizardStep--;
        renderWizardStep();
      }
    }

    function extractAllSubjectsForGroup(course, group) {
      const subjects = new Set();
      const grp = facultyData?.courses?.[course]?.[group] || {};
      Object.values(grp).forEach(day => Object.values(day).forEach(list => list.forEach(l => {
        const parsed = parseLessonRaw(l);
        if (parsed.title && parsed.title.length > 2 && parsed.title !== 'Пара') {
          subjects.add(parsed.title);
        }
      })));
      return Array.from(subjects).sort();
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    function setupSwipeGestures() {
      const main = document.getElementById('mainContent');
      if (!main) return;

      main.addEventListener('touchstart', e => {
        if (e.touches && e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
        }
      }, { passive: true });

      main.addEventListener('touchend', e => {
        if (!e.changedTouches || e.changedTouches.length !== 1) return;
        const modal = document.getElementById('settingsModal');
        if (modal && modal.classList.contains('open')) return;

        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const deltaTime = Date.now() - touchStartTime;

        if (Math.abs(deltaX) > 42 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3 && deltaTime < 700) {
          const isSundayToday = new Date().getDay() === 0;

          if (deltaX < 0) {
            // Swipe Left -> Next day
            if (selectedDayIndex === -1) {
              selectDayIndex(0);
            } else if (selectedDayIndex < DAYS_OF_WEEK.length - 1) {
              selectDayIndex(selectedDayIndex + 1);
            }
          } else if (deltaX > 0) {
            // Swipe Right -> Previous day
            if (selectedDayIndex > 0) {
              selectDayIndex(selectedDayIndex - 1);
            } else if (selectedDayIndex === 0 && isSundayToday) {
              selectDayIndex(-1);
            }
          }
        }
      }, { passive: true });

      window.addEventListener('keydown', e => {
        const modal = document.getElementById('settingsModal');
        if (modal && modal.classList.contains('open')) return;
        const isSundayToday = new Date().getDay() === 0;

        if (e.key === 'ArrowRight') {
          if (selectedDayIndex === -1) {
            selectDayIndex(0);
          } else if (selectedDayIndex < DAYS_OF_WEEK.length - 1) {
            selectDayIndex(selectedDayIndex + 1);
          }
        } else if (e.key === 'ArrowLeft') {
          if (selectedDayIndex > 0) {
            selectDayIndex(selectedDayIndex - 1);
          } else if (selectedDayIndex === 0 && isSundayToday) {
            selectDayIndex(-1);
          }
        }
      });
    }

    async function init() {
      initTheme();
      setupSwipeGestures();

      const savedProfile = localStorage.getItem('bsu_profile');
      if (savedProfile) {
        try { currentProfile = JSON.parse(savedProfile); } catch(e) {}
      }

      const ok = await loadData();
      if (!ok) {
        document.getElementById('headerTitle').textContent = 'Ошибка загрузки расписания';
        return;
      }

      const groupSchedule = facultyData?.courses?.[currentProfile.course]?.[currentProfile.group_name] || {};
      selectedDayIndex = findInitialDayIndex(groupSchedule);

      const isSetupDone = localStorage.getItem('bsu_setup_completed');
      if (!isSetupDone || !currentProfile.group_name) {
        openFirstLaunchWizard();
      } else {
        renderView();
      }
    }

    init();
  </script>
</body>
</html>
