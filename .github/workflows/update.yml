name: Update Schedule from Decanat

on:
  schedule:
    # Run every 15 minutes at off-peak minutes to avoid GitHub Actions runner queue delays
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

concurrency:
  group: schedule-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreOffice and Python packages
        run: |
          sudo apt update
          sudo apt install -y libreoffice-writer libreoffice-calc
          pip install python-docx requests

      - name: Run schedule builder
        run: python build_schedule.py

      - name: Commit and push changes
        run: |
          git config --global user.name "BSU Schedule Bot"
          git config --global user.email "bot@github.com"
          git add schedule_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule from Decanat [skip ci]" && git push)
